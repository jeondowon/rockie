<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>Desktop Pet</title>
    <!-- 도트 폰트 (Galmuri) 로컬 번들. 오프라인에서도 표시, 로드 실패 시 monospace 폴백 -->
    <link rel="stylesheet" href="../../../assets/fonts/galmuri.css" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="onboarding-locked">
    <div id="bubble" class="bubble hidden"></div>
    <img
      id="character"
      class="character"
      src="../../../assets/gif/level0/rockie_right.gif"
      alt="pet"
      draggable="false"
    />
    <!-- 애정 표현용 하트 오버레이(캐릭터와 같은 320 캔버스). 캐릭터 박스에 겹쳐 표시 -->
    <img
      id="heart"
      class="heart hidden"
      src="../../../assets/gif/heart.gif"
      alt=""
      draggable="false"
    />
    <div id="qcard" class="qcard hidden"></div>

    <!-- 모드: 더블클릭 옵션창 / 청소 모드 전체화면 오버레이 -->
    <!-- (집중 모드의 상태·타이머·종료는 메뉴바 트레이 팝업에서 표시) -->
    <div id="mode-panel" class="mode-panel hidden"></div>
    <div id="clean-overlay" class="clean-overlay hidden"></div>
    <div id="nap-overlay" class="nap-overlay hidden"></div>

    <script src="../shared/i18n.js"></script>
    <script src="../shared/sprites.js"></script>
    <script src="../shared/icons.js"></script>
    <script src="pet-data.js"></script>
    <script src="../shared/sound.js"></script>
    <script src="pet.js"></script>
  </body>
</html>
